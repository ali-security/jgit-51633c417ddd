name: seal-build

# Upstream JGit 5.1.x has no GitHub Actions CI (it builds on Eclipse Hudson with
# Maven). This workflow mirrors that build: Maven 3.5.2 + JDK 8 (the reference
# jar manifest says Created-By: Apache Maven 3.5.2, Build-Jdk: 1.8.0_162), the
# default reactor `mvn install`, and the reactor's own surefire test modules.
# The test modules are split over two parallel legs to stay inside the job
# time budget; together they run every test module of the reactor.

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional surefire -Dtest selector; empty runs the full suite"
        required: false
        default: ""

jobs:
  build-test:
    name: build-test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            modules: org.eclipse.jgit.test
          - suite: integration
            modules: org.eclipse.jgit.ant.test,org.eclipse.jgit.http.test,org.eclipse.jgit.pgm.test,org.eclipse.jgit.lfs.test,org.eclipse.jgit.lfs.server.test
    env:
      MAVEN_OPTS: -Xmx2g
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install Maven 3.5.2
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/maven.tgz https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.5.2/apache-maven-3.5.2-bin.tar.gz
          tar -xzf /tmp/maven.tgz -C /tmp
          echo "/tmp/apache-maven-3.5.2/bin" >> "$GITHUB_PATH"

      - name: Build and install all modules
        shell: bash
        run: |
          set -euo pipefail
          mvn -v
          mvn -B -e -V clean install -DskipTests

      # WalkEncryptionTest (org.eclipse.jgit.transport, exercises AmazonS3 /
      # TransportAmazonS3) needs an S3 endpoint and credentials, which upstream
      # supplies on its Hudson CI via jgit-s3-config.properties. Provide a local
      # S3 server (moto, virtual-host style, domain s3.local on port 80, since
      # AmazonS3 builds http://<bucket>.<domain>/ URLs) and the config file in
      # $HOME that the test's Props.discover() reads.
      - name: Start local S3 (moto) for WalkEncryptionTest
        if: matrix.suite == 'core'
        shell: bash
        run: |
          set -euo pipefail
          echo "127.0.0.1 s3.local jgit-test.s3.local" | sudo tee -a /etc/hosts
          python3 -m venv /tmp/moto
          /tmp/moto/bin/pip install -q 'moto[server]>=5,<6'
          sudo nohup /tmp/moto/bin/moto_server -H 127.0.0.1 -p 80 > /tmp/moto.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1/; then break; fi
            sleep 1
          done
          curl -sSf -X PUT http://127.0.0.1/jgit-test
          printf 'accesskey=jgitaccesskey\nsecretkey=jgitsecretkey123\ntest.bucket=jgit-test\ndomain=s3.local\n' \
            > "$HOME/jgit-s3-config.properties"
          curl -sSf http://jgit-test.s3.local/ | head -c 400; echo

      - name: Test (${{ matrix.suite }})
        shell: bash
        env:
          # Same switch as the test pom's upstream "test.long" profile; enables
          # the WalkEncryptionTest TestablePBE/TestableTransformation crypto cases.
          JAVA_TOOL_OPTIONS: -Djgit.test.long=true
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn -B -e test -pl ${{ matrix.modules }} -Dtest='${{ inputs.test-filter }}' -DfailIfNoTests=false
          else
            mvn -B -e test -pl ${{ matrix.modules }}
          fi

      - name: Report test totals and skipped tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import glob
          import xml.etree.ElementTree as ET
          # Why each upstream-guarded test can skip on this runner, read off the
          # guarding @Ignore / Assume statement in the test source.
          REASONS = {
              "MergeGitAttributeTest.mergeBinaryFile_NoAttr_Conflict":
                  "upstream @Ignore: JGit adds conflict markers in binary files (eclipse forum t/1086511)",
              "ObjectDirectoryTest.testScanningForPackfiles":
                  "Assume tmpFile.lastModified() == pack.lastModified(): needs a coarse-timestamp filesystem; ext4 on the runner has ns mtimes",
              "RacyGitTests.testRacyGitDetection":
                  "Assume aMod == indexMod: needs the worktree file and index to land in the same mtime slot; not true with ns mtimes",
              "BatchRefUpdateTest.atomicUpdateRespectsInProcessLock":
                  "Assume atomic: test only applies to the atomic=true parameterisation (atomic=false variant skips by design)",
              "IndexDiffWithSymlinkTest.testSymlinkWithEncodingDifference":
                  "Assume SystemReader.isMacOS(): macOS-only (NFD filename encoding)",
              "CheckoutCommandTest.testNonDeletableFilesOnWindows":
                  "Assume SystemReader.isWindows(): Windows-only file locking",
              "CheckoutCommandTest.testCheckoutAutoCrlfTrue":
                  "Assume foundUnsmudged: needs at least one index entry not racily-smudged, depends on filesystem timestamp resolution",
              "HugeFileTest.testAddHugeFile":
                  "upstream @Ignore: takes ~10 minutes",
              "CommitCommandTest.commitUpdatesSmudgedEntries":
                  "upstream @Ignore: very flaky on Hudson",
              "CommitCommandTest.commitIgnoresSmudgedEntryWithDifferentId":
                  "upstream @Ignore: very flaky on Hudson",
              "WalkEncryptionTest.testCrypto":
                  "Assume isAlgorithmTestable(props): cipher profile not present/allowed in this JRE's JCE providers",
              "URIishTest.testFileWithUserHome":
                  "upstream @Ignore: resolving ~user is beyond standard Java API",
              "ResetTest.testResetPathNoDoubleDashNoRef":
                  "upstream @Ignore: cannot tell commit-ish from path without --",
          }
          def reason_for(cls, name, msg):
              key = cls.rsplit(".", 1)[-1].split("$")[0] + "." + name.split("[")[0]
              return REASONS.get(key, msg)
          total = fail = err = skip = 0
          skipped = []
          for f in sorted(glob.glob("*/target/surefire-reports/TEST-*.xml")):
              root = ET.parse(f).getroot()
              total += int(root.get("tests", 0))
              fail += int(root.get("failures", 0))
              err += int(root.get("errors", 0))
              skip += int(root.get("skipped", 0))
              for tc in root.iter("testcase"):
                  s = tc.find("skipped")
                  if s is not None:
                      msg = s.get("message") or (s.text or "").strip() or "no message (JUnit @Ignore / Assume)"
                      msg = reason_for(tc.get("classname"), tc.get("name"), msg)
                      skipped.append(f"{tc.get('classname')}.{tc.get('name')}: {msg}")
          print(f"SUMMARY tests={total} passed={total - fail - err - skip} failures={fail} errors={err} skipped={skip}")
          for s in skipped:
              print(f"SKIPPED {s}")
          EOF

      - name: Collect release jar
        if: matrix.suite == 'core'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p seal-out
          cp org.eclipse.jgit/target/org.eclipse.jgit-5.1.3.201810200350-r.jar seal-out/

      - name: Upload release jar
        if: matrix.suite == 'core'
        uses: actions/upload-artifact@v4
        with:
          name: org.eclipse.jgit-jar
          path: seal-out/org.eclipse.jgit-5.1.3.201810200350-r.jar
          if-no-files-found: error
